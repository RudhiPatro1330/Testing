spring.application.name=Testing

server.port=8081
spring.datasource.url=jdbc:mysql://${DB_HOST_URL}:3306/${DB_HOST_NAME}?allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=${DB_HOST_USERNAME}
spring.datasource.password=${DB_HOST_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect